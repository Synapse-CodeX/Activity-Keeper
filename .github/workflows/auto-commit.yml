name: Auto Commit Streak

on:
  schedule:
    # Runs at 02:00 AM UTC and 04:00 AM UTC daily
    - cron: '0 2 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.io'

      - name: Make Two Commits
        run: |
          echo "Automated commit 1 - $(date)" >> streak.txt
          git add streak.txt
          git commit -m "chore: automated streak update 1"

          echo "Automated commit 2 - $(date)" >> streak.txt
          git add streak.txt
          git commit -m "chore: automated streak update 2"

          git push